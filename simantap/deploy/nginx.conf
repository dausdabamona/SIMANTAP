# Nginx server block untuk SIMANTAP
# Salin ke: /etc/nginx/sites-available/simantap
# Aktifkan: ln -s /etc/nginx/sites-available/simantap /etc/nginx/sites-enabled/

server {
    listen 80;
    listen [::]:80;
    server_name simantap.poltekkpsorong.ac.id;

    # Redirect HTTP ke HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name simantap.poltekkpsorong.ac.id;

    root /var/www/simantap/public;
    index index.php;

    # SSL (ganti path sesuai sertifikat)
    ssl_certificate     /etc/ssl/certs/simantap.crt;
    ssl_certificate_key /etc/ssl/private/simantap.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Ukuran upload (foto monitoring max 5 × 10MB)
    client_max_body_size 60M;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    charset utf-8;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
    }

    # Blokir akses ke file sensitif
    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~ /\.env {
        deny all;
    }

    # Cache static assets
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    access_log /var/log/nginx/simantap_access.log;
    error_log  /var/log/nginx/simantap_error.log;
}
