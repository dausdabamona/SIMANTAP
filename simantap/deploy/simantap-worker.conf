; Supervisor config untuk Laravel queue worker SIMANTAP
; Salin ke: /etc/supervisor/conf.d/simantap-worker.conf
; Aktifkan:
;   sudo supervisorctl reread
;   sudo supervisorctl update
;   sudo supervisorctl start simantap-worker:*

[program:simantap-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/simantap/artisan queue:work database --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/log/supervisor/simantap-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stopwaitsecs=3600
