server {
    listen 80;
    listen [::]:80;
    server_name domain-anda.com www.domain-anda.com;

    # Redirect semua HTTP ke HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name domain-anda.com www.domain-anda.com;

    root /var/www/simantap/public;
    index index.php;

    # SSL — diisi oleh Certbot secara otomatis
    ssl_certificate     /etc/letsencrypt/live/domain-anda.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/domain-anda.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Upload besar: foto monitoring + PDF
    client_max_body_size 20M;

    # Security headers
    add_header X-Frame-Options           "SAMEORIGIN"            always;
    add_header X-Content-Type-Options    "nosniff"               always;
    add_header X-XSS-Protection          "1; mode=block"         always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(self)"    always;

    # Proteksi file sensitif
    location ~ /\.env {
        deny all;
        return 404;
    }
    location ~ /\.ht {
        deny all;
        return 404;
    }
    location ~ /\.(git|svn) {
        deny all;
        return 404;
    }

    # Laravel entry point
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM
    location ~ \.php$ {
        include        snippets/fastcgi-php.conf;
        fastcgi_pass   unix:/run/php/php8.2-fpm.sock;
        fastcgi_param  SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include        fastcgi_params;

        # Timeout lebih panjang untuk generate PDF
        fastcgi_read_timeout 120;
    }

    # Cache aset statis
    location ~* \.(jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|css|js)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Jangan log favicon & robots
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Log
    access_log /var/log/nginx/simantap-access.log;
    error_log  /var/log/nginx/simantap-error.log;
}
